<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>스카이 스트라이커</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  #menu { position: fixed; top: 12px; left: 12px; z-index: 5; color: #cfe; text-decoration: none; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(20,30,70,.7); border: 1px solid rgba(120,170,255,.35); }
  #menu:hover { background: rgba(40,70,150,.8); }
  canvas { display: block; background: #070a1c; box-shadow: 0 0 40px rgba(80,140,255,.25); touch-action: none; image-rendering: auto; }
</style>
</head>
<body>
<a id="menu" href="../index.html">← 메뉴</a>
<canvas id="c" width="480" height="720"></canvas>
<script>
(() => {
'use strict';
const W = 480, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- 화면 크기 맞춤 ----------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 사운드 (WebAudio) ----------
let actx = null, muted = false;
function sfx(type) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const cfg = {
      shot:   ['square',   880, 440, 0.04, 0.05],
      hit:    ['triangle', 300, 120, 0.06, 0.08],
      boom:   ['sawtooth', 160,  30, 0.18, 0.35],
      power:  ['sine',     500, 1200, 0.15, 0.25],
      hurt:   ['sawtooth', 220,  60, 0.2, 0.4],
      bomb:   ['sawtooth',  90,  20, 0.3, 0.8],
    }[type];
    o.type = cfg[0];
    o.frequency.setValueAtTime(cfg[1], t);
    o.frequency.exponentialRampToValueAtTime(cfg[2], t + cfg[4]);
    g.gain.setValueAtTime(cfg[3], t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + cfg[4]);
    o.start(t); o.stop(t + cfg[4]);
  } catch (e) {}
}

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' || e.code === 'Space') { if (state !== 'play' && state !== 'pause') startGame(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  if (e.code === 'KeyX' && state === 'play') useBomb();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });

let pointer = null; // 터치/마우스 드래그
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
let lastTap = 0;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { startGame(); return; }
  const p = toGame(e);
  const now = performance.now();
  if (now - lastTap < 280) useBomb();
  lastTap = now;
  pointer = { sx: p.x, sy: p.y, px: player.x, py: player.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!pointer) return;
  const p = toGame(e);
  player.x = clamp(pointer.px + (p.x - pointer.sx) * 1.2, 20, W - 20);
  player.y = clamp(pointer.py + (p.y - pointer.sy) * 1.2, 40, H - 30);
});
cv.addEventListener('pointerup', () => { pointer = null; });
cv.addEventListener('pointercancel', () => { pointer = null; });

// ---------- 유틸 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
function loadHi() { try { return +localStorage.getItem('hi_sky') || 0; } catch (e) { return 0; } }
function saveHi(v) { try { localStorage.setItem('hi_sky', v); } catch (e) {} }

// ---------- 게임 상태 ----------
let state = 'title';
let player, bullets, eBullets, enemies, particles, items, texts;
let score, hiScore = loadHi(), lives, bombs, power, stage, stageTimer, spawnTimer, boss, shake, flash, time;

const stars = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.3, 1.5) }));

function startGame() {
  player = { x: W / 2, y: H - 100, r: 6, cool: 0, inv: 120 };
  bullets = []; eBullets = []; enemies = []; particles = []; items = []; texts = [];
  score = 0; lives = 3; bombs = 2; power = 1; stage = 1;
  stageTimer = 0; spawnTimer = 60; boss = null; shake = 0; flash = 0; time = 0;
  state = 'play';
  announce('STAGE 1');
}

function announce(msg) { texts.push({ x: W / 2, y: H / 2 - 60, msg, life: 120, big: true }); }

// ---------- 적 생성 ----------
const ENEMY = {
  scout:  { hp: 2,  r: 16, score: 100, color: '#ff5d73' },
  zig:    { hp: 3,  r: 16, score: 150, color: '#ffb84d' },
  gunner: { hp: 6,  r: 20, score: 300, color: '#b98cff' },
  tank:   { hp: 18, r: 28, score: 800, color: '#4dd8c9' },
};
function spawnEnemy(type, x, y, extra = {}) {
  const d = ENEMY[type];
  const hpMul = 1 + (stage - 1) * 0.35;
  enemies.push(Object.assign({ type, x, y, vx: 0, vy: 2, hp: Math.ceil(d.hp * hpMul), maxHp: Math.ceil(d.hp * hpMul), r: d.r, t: 0, fire: rand(40, 100), hitT: 0 }, extra));
}
function spawnWave() {
  const r = Math.random();
  const sp = 1 + stage * 0.15;
  if (r < 0.35) {
    // V 편대
    const cx = rand(80, W - 80);
    for (let i = 0; i < 5; i++) spawnEnemy('scout', cx + (i - 2) * 36, -30 - Math.abs(i - 2) * 30, { vy: 2.4 * sp });
  } else if (r < 0.6) {
    // 지그재그 줄
    const left = Math.random() < 0.5;
    for (let i = 0; i < 4; i++) spawnEnemy('zig', left ? 80 : W - 80, -30 - i * 50, { vy: 2 * sp, amp: left ? 1 : -1 });
  } else if (r < 0.85) {
    for (let i = 0; i < 2 + (stage > 2 ? 1 : 0); i++) spawnEnemy('gunner', rand(50, W - 50), -30 - i * 60, { vy: 1.3, stopY: rand(90, 220) });
  } else {
    spawnEnemy('tank', rand(80, W - 80), -40, { vy: 0.8 * sp });
  }
}
function spawnBoss() {
  const hp = 260 + stage * 140;
  boss = { x: W / 2, y: -100, r: 60, hp, maxHp: hp, t: 0, phase: 0, hitT: 0, entering: true };
  announce('⚠ WARNING ⚠');
}

// ---------- 발사 ----------
function playerShoot() {
  const p = player;
  const add = (dx, vx) => bullets.push({ x: p.x + dx, y: p.y - 18, vx, vy: -11, dmg: 1 });
  add(0, 0);
  if (power >= 2) { add(-10, 0); add(10, 0); }
  if (power >= 3) { add(-14, -1.6); add(14, 1.6); }
  if (power >= 4) { add(-18, -3); add(18, 3); }
  sfx('shot');
}
function enemyShoot(x, y, speed = 3.5, spread = 0, count = 1) {
  const base = Math.atan2(player.y - y, player.x - x);
  for (let i = 0; i < count; i++) {
    const a = base + (count > 1 ? (i - (count - 1) / 2) * spread : 0);
    eBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
  }
}
function ring(x, y, n, speed, off = 0) {
  for (let i = 0; i < n; i++) {
    const a = off + i / n * Math.PI * 2;
    eBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
  }
}

function useBomb() {
  if (bombs <= 0 || !player) return;
  bombs--;
  sfx('bomb');
  flash = 25; shake = 20;
  eBullets = [];
  for (const e of enemies) { e.hp -= 30; }
  if (boss && !boss.entering) { boss.hp -= 40; }
  player.inv = Math.max(player.inv, 60);
}

// ---------- 파티클 ----------
function explode(x, y, color, n = 18, big = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, 5) * big;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, color, size: rand(2, 4) * big });
  }
}
function dropItem(x, y) {
  const r = Math.random();
  let kind = null;
  if (r < 0.10) kind = 'P';
  else if (r < 0.13) kind = 'B';
  else if (r < 0.15) kind = 'H';
  if (kind) items.push({ x, y, kind, vy: 1.4, t: 0 });
}

// ---------- 업데이트 ----------
function update() {
  time++;
  for (const s of stars) { s.y += s.z * (state === 'play' ? 2 : 0.8); if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  if (state !== 'play') return;

  // 플레이어 이동
  const sp = (keys.ShiftLeft || keys.ShiftRight) ? 2.6 : 5.2;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx--;
  if (keys.ArrowRight || keys.KeyD) dx++;
  if (keys.ArrowUp || keys.KeyW) dy--;
  if (keys.ArrowDown || keys.KeyS) dy++;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x = clamp(player.x + dx * sp, 20, W - 20);
  player.y = clamp(player.y + dy * sp, 40, H - 30);
  player.tilt = dx;
  if (player.inv > 0) player.inv--;

  // 자동 연사
  player.cool--;
  if (player.cool <= 0) { playerShoot(); player.cool = 7; }

  // 스테이지 진행
  stageTimer++;
  if (!boss) {
    spawnTimer--;
    if (spawnTimer <= 0) { spawnWave(); spawnTimer = Math.max(45, 120 - stage * 12) + rand(0, 40); }
    if (stageTimer > 60 * 45) spawnBoss(); // 45초 후 보스
  }

  // 아군 탄
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  // 적
  for (const e of enemies) {
    e.t++;
    if (e.hitT > 0) e.hitT--;
    if (e.type === 'zig') { e.x += Math.sin(e.t / 18) * 3.2 * e.amp; }
    if (e.type === 'gunner' && e.y >= e.stopY && e.t < 360) { e.vy = 0; } else if (e.type === 'gunner' && e.t >= 360) { e.vy = 2; }
    e.x += e.vx; e.y += e.vy;
    e.fire--;
    if (e.fire <= 0 && e.y > 0 && e.y < H * 0.7) {
      if (e.type === 'gunner') { enemyShoot(e.x, e.y + 10, 3.4, 0.25, 3); e.fire = 70; }
      else if (e.type === 'tank') { ring(e.x, e.y, 12, 2.6, e.t / 20); e.fire = 80; }
      else if (stage >= 2 && Math.random() < 0.4) { enemyShoot(e.x, e.y + 10, 3); e.fire = 140; }
      else e.fire = 140;
    }
  }

  // 보스
  if (boss) updateBoss();

  // 적 탄
  for (const b of eBullets) { b.x += b.vx; b.y += b.vy; }
  eBullets = eBullets.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // 충돌: 아군탄 → 적
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.hp > 0 && dist2(b, e) < (e.r + 4) ** 2) { e.hp -= b.dmg; e.hitT = 4; b.dead = true; break; }
    }
    if (!b.dead && boss && !boss.entering && Math.abs(b.x - boss.x) < 70 && Math.abs(b.y - boss.y) < 40) {
      boss.hp -= b.dmg; boss.hitT = 3; b.dead = true;
      if (Math.random() < 0.3) particles.push({ x: b.x, y: b.y, vx: rand(-1, 1), vy: rand(-2, 0), life: 10, max: 10, color: '#fff', size: 2 });
    }
  }
  // 적 사망 처리
  for (const e of enemies) {
    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      const d = ENEMY[e.type];
      score += d.score;
      explode(e.x, e.y, d.color, e.type === 'tank' ? 40 : 18, e.type === 'tank' ? 1.6 : 1);
      sfx(e.type === 'tank' ? 'boom' : 'hit');
      if (e.type === 'tank') { shake = 8; items.push({ x: e.x, y: e.y, kind: 'P', vy: 1.4, t: 0 }); }
      else dropItem(e.x, e.y);
      texts.push({ x: e.x, y: e.y, msg: '+' + d.score, life: 40 });
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 60);

  // 아이템
  for (const it of items) {
    it.t++; it.y += it.vy; it.x += Math.sin(it.t / 15) * 0.8;
    if (dist2(it, player) < 26 ** 2) {
      it.dead = true; sfx('power');
      if (it.kind === 'P') { if (power < 4) power++; else score += 1000; texts.push({ x: it.x, y: it.y, msg: power < 4 ? 'POWER UP!' : '+1000', life: 50 }); }
      if (it.kind === 'B') { bombs = Math.min(bombs + 1, 5); texts.push({ x: it.x, y: it.y, msg: 'BOMB +1', life: 50 }); }
      if (it.kind === 'H') { lives = Math.min(lives + 1, 5); texts.push({ x: it.x, y: it.y, msg: '1UP!', life: 50 }); }
    }
  }
  items = items.filter(it => !it.dead && it.y < H + 20);

  // 피격 판정
  if (player.inv <= 0) {
    let hit = false;
    for (const b of eBullets) if (dist2(b, player) < (b.r + player.r - 1) ** 2) { hit = true; b.dead = true; break; }
    if (!hit) for (const e of enemies) if (dist2(e, player) < (e.r * 0.7 + player.r) ** 2) { hit = true; e.hp -= 10; break; }
    if (!hit && boss && Math.abs(player.x - boss.x) < 60 && Math.abs(player.y - boss.y) < 35) hit = true;
    if (hit) playerHit();
  }
  eBullets = eBullets.filter(b => !b.dead);

  // 파티클 & 텍스트
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.life--; if (!t.big) t.y -= 0.8; }
  texts = texts.filter(t => t.life > 0);
  if (shake > 0) shake--;
  if (flash > 0) flash--;

  if (score > hiScore) { hiScore = score; }
}

function updateBoss() {
  const b = boss;
  b.t++;
  if (b.hitT > 0) b.hitT--;
  if (b.entering) {
    b.y += 1.5;
    if (b.y >= 130) { b.entering = false; b.t = 0; }
    return;
  }
  b.x = W / 2 + Math.sin(b.t / 90) * 140;
  const ratio = b.hp / b.maxHp;
  b.phase = ratio > 0.66 ? 0 : ratio > 0.33 ? 1 : 2;
  const spd = 1 + stage * 0.12;
  if (b.phase === 0) {
    if (b.t % 50 === 0) enemyShoot(b.x, b.y + 40, 3.6 * spd, 0.18, 5);
    if (b.t % 90 === 45) { enemyShoot(b.x - 50, b.y + 20, 4 * spd); enemyShoot(b.x + 50, b.y + 20, 4 * spd); }
  } else if (b.phase === 1) {
    if (b.t % 8 === 0) { const a = b.t / 12; eBullets.push({ x: b.x, y: b.y + 30, vx: Math.cos(a) * 3 * spd, vy: Math.abs(Math.sin(a)) * 3 * spd + 0.5, r: 5 }); }
    if (b.t % 70 === 0) enemyShoot(b.x, b.y + 40, 4.2 * spd, 0.2, 3);
  } else {
    if (b.t % 36 === 0) ring(b.x, b.y, 18, 2.6 * spd, b.t / 30);
    if (b.t % 24 === 12) enemyShoot(b.x, b.y + 40, 4.6 * spd, 0.15, 3);
  }
  if (b.hp <= 0) {
    for (let i = 0; i < 6; i++) explode(b.x + rand(-60, 60), b.y + rand(-30, 30), i % 2 ? '#ffcc4d' : '#ff5d73', 30, 2);
    sfx('boom'); sfx('bomb');
    shake = 30; flash = 15;
    const bonus = 5000 * stage;
    score += bonus;
    texts.push({ x: b.x, y: b.y, msg: '+' + bonus, life: 70 });
    eBullets = [];
    items.push({ x: b.x - 30, y: b.y, kind: 'P', vy: 1.4, t: 0 }, { x: b.x + 30, y: b.y, kind: 'H', vy: 1.4, t: 0 });
    boss = null;
    stage++; stageTimer = 0; spawnTimer = 180;
    announce('STAGE ' + stage);
  }
}

function playerHit() {
  sfx('hurt');
  explode(player.x, player.y, '#6cf', 30, 1.3);
  shake = 15;
  lives--;
  power = Math.max(1, power - 1);
  eBullets = [];
  if (lives <= 0) {
    state = 'over';
    saveHi(hiScore);
    return;
  }
  player.inv = 150;
  player.x = W / 2; player.y = H - 100;
  bombs = Math.max(bombs, 2);
}

// ---------- 그리기 ----------
function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 5) % 2) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(1 - Math.abs(p.tilt || 0) * 0.15, 1);
  // 엔진 불꽃
  const fl = 10 + Math.random() * 8;
  const g = ctx.createLinearGradient(0, 12, 0, 12 + fl);
  g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#6cf'); g.addColorStop(1, 'rgba(60,120,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(5, 12); ctx.fill();
  // 날개
  ctx.fillStyle = '#2f6fe0';
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-22, 12); ctx.lineTo(-20, 16); ctx.lineTo(0, 10); ctx.lineTo(20, 16); ctx.lineTo(22, 12); ctx.closePath(); ctx.fill();
  // 동체
  ctx.fillStyle = '#e8f1ff';
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(7, 4); ctx.lineTo(5, 14); ctx.lineTo(-5, 14); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
  // 꼬리날개
  ctx.fillStyle = '#2f6fe0';
  ctx.beginPath(); ctx.moveTo(-4, 8); ctx.lineTo(-10, 16); ctx.lineTo(-3, 14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4, 8); ctx.lineTo(10, 16); ctx.lineTo(3, 14); ctx.fill();
  // 조종석
  ctx.fillStyle = '#4de1ff';
  ctx.beginPath(); ctx.ellipse(0, -6, 3, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 저속 이동 시 판정 표시
  if (keys.ShiftLeft || keys.ShiftRight) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#f36';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function drawEnemy(e) {
  const d = ENEMY[e.type];
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = e.hitT > 0 ? '#fff' : d.color;
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (e.type === 'scout') {
    ctx.moveTo(0, 16); ctx.lineTo(-16, -10); ctx.lineTo(-6, -6); ctx.lineTo(0, -14); ctx.lineTo(6, -6); ctx.lineTo(16, -10);
  } else if (e.type === 'zig') {
    ctx.rotate(e.t / 10);
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17); ctx.lineTo(Math.cos(a + 0.78) * 7, Math.sin(a + 0.78) * 7); }
  } else if (e.type === 'gunner') {
    ctx.moveTo(0, 20); ctx.lineTo(-20, 0); ctx.lineTo(-14, -16); ctx.lineTo(14, -16); ctx.lineTo(20, 0);
  } else {
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; ctx.lineTo(Math.cos(a) * 28, Math.sin(a) * 28); }
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 코어
  ctx.fillStyle = 'rgba(20,10,40,.8)';
  ctx.beginPath(); ctx.arc(0, e.type === 'scout' ? -2 : 0, e.type === 'tank' ? 10 : 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (e.type === 'tank' || e.type === 'gunner') {
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 3);
    ctx.fillStyle = d.color; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * (e.hp / e.maxHp), 3);
  }
}

function drawBoss() {
  const b = boss;
  ctx.save();
  ctx.translate(b.x, b.y);
  const c = b.hitT > 0 ? '#fff' : ['#c33a5a', '#d4602c', '#e02a2a'][b.phase];
  ctx.fillStyle = c;
  ctx.strokeStyle = '#2a0a18'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 50); ctx.lineTo(-30, 30); ctx.lineTo(-80, 20); ctx.lineTo(-90, -10); ctx.lineTo(-50, -30); ctx.lineTo(-20, -45);
  ctx.lineTo(20, -45); ctx.lineTo(50, -30); ctx.lineTo(90, -10); ctx.lineTo(80, 20); ctx.lineTo(30, 30); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3a1028';
  ctx.fillRect(-56, 8, 14, 22); ctx.fillRect(42, 8, 14, 22);
  const pulse = 10 + Math.sin(b.t / 6) * 3;
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, pulse * 1.8);
  g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffd34d'); g.addColorStop(1, 'rgba(255,80,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, pulse * 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 체력바
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(40, 48, W - 80, 8);
  ctx.fillStyle = '#ff4d6a'; ctx.fillRect(40, 48, (W - 80) * Math.max(0, b.hp / b.maxHp), 8);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('BOSS', 40, 44);
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText('SCORE ' + score.toLocaleString(), 12, 24);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9ab';
  ctx.fillText('HI ' + hiScore.toLocaleString(), W - 12, 24);
  // 생명
  ctx.textAlign = 'left'; ctx.font = '14px sans-serif';
  for (let i = 0; i < lives; i++) { ctx.fillStyle = '#6cf'; drawMini(18 + i * 22, H - 22); }
  ctx.fillStyle = '#ffcc4d';
  ctx.fillText('BOMB ' + '●'.repeat(bombs), 12, H - 40);
  ctx.textAlign = 'right'; ctx.fillStyle = '#8f8';
  ctx.fillText('POWER ' + (power >= 4 ? 'MAX' : power), W - 12, H - 18);
  ctx.fillStyle = '#9ab'; ctx.fillText('STAGE ' + stage, W - 12, H - 38);
}
function drawMini(x, y) {
  ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y + 6); ctx.lineTo(x - 8, y + 6); ctx.closePath(); ctx.fill();
}

function drawCenter(lines) {
  ctx.textAlign = 'center';
  for (const [txt, y, size, color] of lines) {
    ctx.font = `bold ${size}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
    ctx.fillStyle = color; ctx.fillText(txt, W / 2, y);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);
  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070a1c'); bg.addColorStop(1, '#121a3a');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) {
    ctx.fillStyle = `rgba(200,220,255,${s.z / 1.6})`;
    ctx.fillRect(s.x, s.y, s.z * 1.5, s.z * (state === 'play' ? 4 : 1.5));
  }

  if (state === 'play' || state === 'pause' || state === 'over') {
    for (const it of items) {
      const col = { P: '#4dff88', B: '#ffcc4d', H: '#ff6b9a' }[it.kind];
      ctx.save(); ctx.translate(it.x, it.y);
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#111'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.kind, 0, 1); ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBoss();
    // 아군 탄
    ctx.fillStyle = '#9ff';
    ctx.shadowColor = '#4df'; ctx.shadowBlur = 8;
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    ctx.shadowBlur = 0;
    if (state !== 'over') drawPlayer();
    // 적 탄
    for (const b of eBullets) {
      ctx.fillStyle = '#ff3d6e'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe0ea'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of particles) {
      ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, t.life / 20);
      ctx.textAlign = 'center';
      ctx.font = t.big ? 'bold 40px sans-serif' : 'bold 14px sans-serif';
      ctx.fillStyle = t.big ? '#ffde59' : '#fff';
      ctx.fillText(t.msg, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    drawHUD();
  }
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 30})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'title') {
    drawCenter([
      ['SKY STRIKER', 250, 50, '#6cf'],
      ['스카이 스트라이커', 290, 22, '#cfe'],
      ['이동: 방향키 / WASD (모바일: 드래그)', 380, 15, '#ccd'],
      ['사격: 자동 연사   ·   저속 이동: Shift', 405, 15, '#ccd'],
      ['폭탄: X (모바일: 더블탭)   ·   일시정지: P', 430, 15, '#ccd'],
      ['P 파워업  ·  B 폭탄  ·  H 생명', 470, 15, '#ffcc4d'],
      [(Math.floor(time / 30) % 2 ? '' : 'ENTER / 탭 해서 시작'), 560, 22, '#fff'],
      ['HI SCORE ' + hiScore.toLocaleString(), 620, 16, '#9ab'],
      ['마음 보내실 곳 1111-111111111111', 670, 14, '#ffcc4d'],
    ]);
  } else if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    drawCenter([['일시정지', H / 2, 40, '#fff'], ['P 를 눌러 계속', H / 2 + 40, 16, '#ccd']]);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    drawCenter([
      ['GAME OVER', 280, 48, '#ff5d73'],
      ['점수 ' + score.toLocaleString(), 340, 24, '#fff'],
      ['도달 스테이지 ' + stage, 375, 18, '#ccd'],
      [score >= hiScore && score > 0 ? '★ 최고 기록! ★' : 'HI ' + hiScore.toLocaleString(), 415, 18, '#ffcc4d'],
      [(Math.floor(time / 30) % 2 ? '' : 'ENTER / 탭 해서 재시작'), 500, 20, '#fff'],
      ['마음 보내실 곳 1111-111111111111', 600, 14, '#ffcc4d'],
    ]);
  }
}

// ---------- 루프 (60fps 고정 스텝) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
