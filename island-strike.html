<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>아일랜드 스트라이크</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a2a44; color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-user-select: none; user-select: none; }
  canvas#gl { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
  #menu { position: fixed; top: 12px; left: 12px; z-index: 20; color: #cfe; text-decoration: none; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(20,30,70,.7); border: 1px solid rgba(120,170,255,.35); }
  #menu:hover { background: rgba(40,70,150,.8); }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; text-shadow: 0 1px 3px rgba(0,0,0,.75); }
  #top { position: absolute; top: 12px; right: 12px; left: 100px; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
  #top b { color: #ffe27a; font-size: 16px; margin-left: 4px; }
  #bossbox { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); width: min(420px, 78vw); display: none; text-align: center; font-size: 12px; font-weight: 800; color: #ffc0c0; }
  #bossbox .bar { height: 10px; margin-top: 3px; border-radius: 6px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,140,140,.6); overflow: hidden; }
  #bossfill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3d3d, #ffb340); transition: width .15s; }
  #bottom { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 700; }
  .chips span { padding: 4px 9px; border-radius: 999px; background: rgba(8,30,60,.55); border: 1px solid rgba(140,200,255,.3); white-space: nowrap; }
  #lv { color: #bfe3ff; } #bm { color: #9fd0ff; } #pw { color: #ffb0a0; }
  #opts { font-size: 11px; opacity: .85; text-align: right; white-space: nowrap; }
  #msg { position: absolute; top: 33%; left: 0; right: 0; text-align: center; font-size: clamp(22px, 7vw, 46px); font-weight: 900; letter-spacing: 2px; opacity: 0; transition: opacity .25s; }
  #msg.warn { color: #ff5050; }
  #center { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 12; pointer-events: none; padding: 16px; box-sizing: border-box; }
  #panel { background: rgba(6,24,48,.74); border: 1px solid rgba(140,200,255,.35); border-radius: 18px; padding: 20px 24px; max-width: 440px; width: 100%; box-sizing: border-box; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #panel h1 { margin: 0 0 2px; font-size: clamp(26px, 8vw, 40px); letter-spacing: 1px; color: #ffe27a; text-shadow: 0 3px 0 #b8501f; }
  #panel h2 { margin: 0 0 8px; font-size: clamp(24px, 7vw, 36px); }
  #panel p { margin: 6px 0; }
  .sub { color: #bfe3ff; font-size: 13px; }
  .ctl { text-align: left; font-size: 13px; line-height: 1.75; margin: 12px 0; }
  .ctl kbd { display: inline-block; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); font: inherit; font-size: 12px; }
  .note { font-size: 12px; color: #ffd28a; }
  .big { font-size: 22px; font-weight: 800; }
  .blink { animation: bl 1s steps(2) infinite; font-weight: 800; color: #fff; }
  @keyframes bl { 50% { opacity: 0; } }
  #pbtn { position: fixed; right: 12px; bottom: 46px; z-index: 15; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(140,200,255,.4); background: rgba(8,30,60,.6); color: #fff; font-weight: 900; font-size: 14px; display: none; }
</style>
</head>
<body>
<a id="menu" href="../index.html">← 메뉴</a>
<div id="hud">
  <div id="top"><div>SCORE<b id="sc">0</b></div><div>HI<b id="hi">0</b></div><div>STAGE<b id="st">1</b></div></div>
  <div id="bossbox"><div>거대 전함</div><div class="bar"><i id="bossfill"></i></div></div>
  <div id="msg"></div>
  <div id="bottom">
    <div class="chips"><span id="lv"></span><span id="bm"></span><span id="pw"></span></div>
    <div id="opts"></div>
  </div>
</div>
<div id="center"><div id="panel"><h1>아일랜드 스트라이크</h1><p class="sub">로딩 중…</p></div></div>
<button id="pbtn" aria-label="일시정지">II</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function loadHi() { try { return +localStorage.getItem('hi_island') || 0; } catch (e) { return 0; } }
function saveHi(v) { try { localStorage.setItem('hi_island', v); } catch (e) {} }

if (typeof THREE === 'undefined') {
  $('panel').innerHTML = '<h2>로딩 실패</h2><p>three.js 를 불러오지 못했습니다.<br>인터넷 연결을 확인해 주세요.</p>';
  return;
}

// ---------- 상수 / 상태 ----------
const SPEED = 0.26;          // 월드 스크롤 속도 (프레임당)
const AIR_Y = 8;             // 비행 고도
const RET = 15;              // 폭탄 조준 거리
const BT = 36;               // 폭탄 낙하 시간 (프레임)
const MAXB = 9;              // 최대 폭탄
const BOSS_AT = 60 * 70;     // 보스 등장 시점
const BOSS_Z = -24;
let state = 'title', frame = 0, score = 0, hiScore = loadHi(), lives = 3, bombs = 5, power = 1, stage = 1;
let stageT = 0, scrollDist = 0, seaOff = 0, shake = 0, boss = null, bossPhase = false, autoFire = true, muted = false;
let overT = 0, clearT = 0, warnT = 0, nextIsland = 0, nextShip = 400, nextWave = 150, bombCool = 0, bombRegen = 0, nextExtend = 50000;
let wantBomb = false, drag = null;
let XB = 14, ZMIN = -22, ZMAX = 12;
const diff = () => 1 + (stage - 1) * 0.3;

// ---------- 사운드 (WebAudio) ----------
let actx = null, noiseBuf = null, lastBoom = -99, shotTick = 0;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noise(a, t, dur, vol, freq) {
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate | 0, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t); s.stop(t + dur);
}
const SFX = {
  shot:  ['square',   900,  500, 0.022, 0.05],
  hit:   ['triangle', 420,  160, 0.05,  0.06],
  boom:  ['sawtooth', 140,   30, 0.10,  0.40, 0.35, 1500],
  big:   ['sawtooth',  90,   20, 0.18,  0.90, 0.60,  900],
  drop:  ['sine',    1400,  320, 0.05,  0.42],
  power: ['sine',     500, 1400, 0.14,  0.28],
  hurt:  ['sawtooth', 260,   50, 0.20,  0.60, 0.40, 2000],
  warn:  ['square',   440,  220, 0.07,  0.45],
  empty: ['square',   160,  120, 0.04,  0.08],
};
function sfx(type) {
  if (muted) return;
  try {
    const c = SFX[type]; if (!c) return;
    if (type === 'boom') { if (frame - lastBoom < 4) return; lastBoom = frame; }
    const a = ac(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = c[0];
    o.frequency.setValueAtTime(c[1], t);
    o.frequency.exponentialRampToValueAtTime(c[2], t + c[4]);
    g.gain.setValueAtTime(c[3], t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + c[4]);
    o.start(t); o.stop(t + c[4]);
    if (c[5]) noise(a, t, c[4] * 1.2, c[5], c[6]);
  } catch (e) {}
}

// ---------- 렌더러 / 씬 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.id = 'gl';
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
const SKY = 0x8fd0ee;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 72, 138);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 320);
const pickCam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 320);
const CAM_POS = new THREE.Vector3(0, 44, 28), CAM_LOOK = new THREE.Vector3(0, 0, -6);
const tmpLook = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x2a5a7a, 0.68));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.95);
sun.position.set(-18, 60, 8);
sun.target.position.set(0, 0, -12);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -48; sun.shadow.camera.right = 48;
sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -50;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0008;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const boomLight = new THREE.PointLight(0xffaa55, 0, 45, 2);
scene.add(boomLight);

// ---------- 화면 크기 / 경계 ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tmpV = new THREE.Vector3();
const airPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -AIR_Y);
function hitAir(cam, nx, ny, out) {
  ndc.set(nx, ny); ray.setFromCamera(ndc, cam);
  return ray.ray.intersectPlane(airPlane, out);
}
let pScale = 400;
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h);
  const fov = a < 0.8 ? Math.min(95, 2 * Math.atan(Math.tan(25 * Math.PI / 180) * 0.8 / a) * 180 / Math.PI) : 50;
  for (const c of [camera, pickCam]) {
    c.aspect = a; c.fov = fov; c.updateProjectionMatrix();
    c.position.copy(CAM_POS); c.lookAt(CAM_LOOK); c.updateMatrixWorld();
  }
  if (hitAir(pickCam, 1, -0.6, tmpV)) XB = clamp(Math.abs(tmpV.x) - 2.5, 8, 24);
  if (hitAir(pickCam, 0, -0.8, tmpV)) ZMAX = clamp(tmpV.z, 4, 16);
  if (hitAir(pickCam, 0, 0.5, tmpV)) ZMIN = clamp(tmpV.z, -30, -8);
  pScale = h * renderer.getPixelRatio() / (2 * Math.tan(fov * Math.PI / 360));
  if (typeof FIRE !== 'undefined') { FIRE.mat.uniforms.scale.value = pScale; SMOKE.mat.uniforms.scale.value = pScale; }
}

// ---------- 재질 / 지오메트리 ----------
const matCache = {};
function mat(c) { return matCache[c] || (matCache[c] = new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 12 })); }
const M = {
  dark: mat(0x2a2d33), concrete: mat(0x8d9096), sand: mat(0xe6d29a), grass: mat(0x5aa24c), grass2: mat(0x3e8a3f),
  rock: mat(0x8e8a7c), trunk: mat(0x7a5434), leaf: mat(0x2f7d3a), leaf2: mat(0x4ea64a), wall: mat(0xe0d8c6),
  roof: mat(0xc0583e), roof2: mat(0x4f6fa8), track: mat(0x2b2b2b), pWhite: mat(0xeef3f8), pBlue: mat(0x2f6fd8),
  eAccent: mat(0x3a3f4a),
  glass: new THREE.MeshPhongMaterial({ color: 0x7fd4ff, shininess: 90, flatShading: true }),
  foam: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, depthWrite: false }),
  cloud: new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.82, emissive: 0x666666 }),
  glow: new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }),
  flash: new THREE.MeshBasicMaterial({ color: 0xfff0a0, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }),
};
function rotGeo(g, rx) { g.rotateX(rx); return g; }
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl6: new THREE.CylinderGeometry(1, 1, 1, 6),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 8),
  cone5: new THREE.ConeGeometry(1, 1, 5),
  cone4: new THREE.ConeGeometry(1, 1, 4),
  ico: new THREE.IcosahedronGeometry(1, 0),
  sph: new THREE.SphereGeometry(1, 8, 6),
  tri: new THREE.CylinderGeometry(4.04, 4.04, 1, 3),
  fus: rotGeo(new THREE.CylinderGeometry(0.3, 0.5, 4.2, 6), -Math.PI / 2),
  nose: rotGeo(new THREE.ConeGeometry(0.3, 1.1, 6), -Math.PI / 2),
  disc: rotGeo(new THREE.CircleGeometry(1, 16), -Math.PI / 2),
  ring: rotGeo(new THREE.RingGeometry(0.8, 1, 28), -Math.PI / 2),
};
function part(geo, m, sx, sy, sz, x, y, z, parent) {
  const o = new THREE.Mesh(geo, m);
  o.scale.set(sx, sy, sz); o.position.set(x, y, z);
  o.castShadow = true;
  if (parent) parent.add(o);
  return o;
}

// ---------- 바다 ----------
const seaGeo = new THREE.PlaneGeometry(240, 200, 48, 40);
seaGeo.rotateX(-Math.PI / 2);
const seaPos = seaGeo.attributes.position;
const seaBase = Float32Array.from(seaPos.array);
const sea = new THREE.Mesh(seaGeo, new THREE.MeshPhongMaterial({ color: 0x1f72ad, flatShading: true, shininess: 70, specular: 0x9cc8e8 }));
sea.position.z = -30;
sea.receiveShadow = true;
scene.add(sea);
function updateSea(t) {
  const a = seaPos.array;
  for (let i = 0; i < a.length; i += 3) {
    const x = seaBase[i], z = seaBase[i + 2] - 30 - seaOff;
    a[i + 1] = Math.sin(x * 0.22 + t * 1.3) * 0.3 + Math.sin(z * 0.17 + t * 0.9) * 0.38 + Math.sin((x + z) * 0.41 + t * 2.1) * 0.14;
  }
  seaPos.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// ---------- 파티클 (Points + 셰이더) ----------
const PVS = 'attribute float psize; attribute vec3 pcol; attribute float palpha; uniform float scale; varying vec3 vC; varying float vA;\n' +
  'void main(){ vC = pcol; vA = palpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = psize * scale / max(0.1, -mv.z); gl_Position = projectionMatrix * mv; }';
const PFS = 'varying vec3 vC; varying float vA;\n' +
  'void main(){ float d = length(gl_PointCoord - vec2(0.5)); if (d > 0.5) discard; gl_FragColor = vec4(vC, vA * (1.0 - smoothstep(0.12, 0.5, d))); }';
const PNAMES = ['px', 'py', 'pz', 'vx', 'vy', 'vz', 'life', 'ml', 's0', 's1', 'a0', 'gr', 'dr', 'r1', 'g1', 'b1', 'r2', 'g2', 'b2'];
function PSys(max, additive, order) {
  this.max = max; this.n = 0;
  const geo = this.geo = new THREE.BufferGeometry();
  this.aPos = new Float32Array(max * 3); this.aCol = new Float32Array(max * 3);
  this.aSize = new Float32Array(max); this.aAl = new Float32Array(max);
  const at = (arr, n) => { const b = new THREE.BufferAttribute(arr, n); b.setUsage(THREE.DynamicDrawUsage); return b; };
  geo.setAttribute('position', at(this.aPos, 3));
  geo.setAttribute('pcol', at(this.aCol, 3));
  geo.setAttribute('psize', at(this.aSize, 1));
  geo.setAttribute('palpha', at(this.aAl, 1));
  geo.setDrawRange(0, 0);
  this.mat = new THREE.ShaderMaterial({
    uniforms: { scale: { value: pScale } }, vertexShader: PVS, fragmentShader: PFS,
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  this.pts = new THREE.Points(geo, this.mat);
  this.pts.frustumCulled = false; this.pts.renderOrder = order;
  scene.add(this.pts);
  this.F = [];
  for (const k of PNAMES) { this[k] = new Float32Array(max); this.F.push(this[k]); }
}
PSys.prototype.add = function (x, y, z, vx, vy, vz, life, s0, s1, a0, c1, c2, gr, dr) {
  if (this.n >= this.max) return;
  const i = this.n++;
  this.px[i] = x; this.py[i] = y; this.pz[i] = z;
  this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
  this.life[i] = this.ml[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.a0[i] = a0;
  this.gr[i] = gr; this.dr[i] = dr;
  this.r1[i] = c1[0]; this.g1[i] = c1[1]; this.b1[i] = c1[2];
  this.r2[i] = c2[0]; this.g2[i] = c2[1]; this.b2[i] = c2[2];
};
PSys.prototype.step = function () {
  for (let i = 0; i < this.n; i++) {
    if (--this.life[i] <= 0) {
      const j = --this.n;
      if (i !== j) for (const a of this.F) a[i] = a[j];
      i--; continue;
    }
    const d = this.dr[i];
    this.vx[i] *= d; this.vy[i] = this.vy[i] * d + this.gr[i]; this.vz[i] *= d;
    this.px[i] += this.vx[i]; this.py[i] += this.vy[i]; this.pz[i] += this.vz[i] + SPEED;
  }
};
PSys.prototype.flush = function () {
  for (let i = 0; i < this.n; i++) {
    const k = 1 - this.life[i] / this.ml[i];
    this.aPos[i * 3] = this.px[i]; this.aPos[i * 3 + 1] = this.py[i]; this.aPos[i * 3 + 2] = this.pz[i];
    this.aCol[i * 3] = lerp(this.r1[i], this.r2[i], k);
    this.aCol[i * 3 + 1] = lerp(this.g1[i], this.g2[i], k);
    this.aCol[i * 3 + 2] = lerp(this.b1[i], this.b2[i], k);
    this.aSize[i] = lerp(this.s0[i], this.s1[i], k);
    this.aAl[i] = this.a0[i] * Math.min(1, k * 8) * (1 - k);
  }
  this.geo.setDrawRange(0, this.n);
  const at = this.geo.attributes;
  at.position.needsUpdate = at.pcol.needsUpdate = at.psize.needsUpdate = at.palpha.needsUpdate = true;
};
PSys.prototype.clear = function () { this.n = 0; };
const SMOKE = new PSys(900, false, 1);
const FIRE = new PSys(1400, true, 2);
const rgb = h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];
const C = {
  fire1: rgb(0xfff2a0), fire2: rgb(0xff3a10), spark1: rgb(0xffffff), spark2: rgb(0xffa030),
  smoke1: rgb(0x3a3a3a), smoke2: rgb(0x9a9a9a), black1: rgb(0x1a1a1a), black2: rgb(0x555555),
  water1: rgb(0xffffff), water2: rgb(0xbfe6ff), trail1: rgb(0xffe0a0), trail2: rgb(0xff4020),
  wake: rgb(0xeaf6ff), pink: rgb(0xff6fa0),
};

// ---------- 충격파 링 풀 ----------
const rings = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(G.ring, new THREE.MeshBasicMaterial({ color: 0xffc070, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  m.visible = false; scene.add(m);
  rings.push({ m, t: 0, s: 1 });
}
function shockRing(x, y, z, s) {
  const r = rings.find(r => r.t <= 0) || rings[0];
  r.t = 22; r.s = s; r.m.visible = true; r.m.position.set(x, y, z);
}
function updateRings() {
  for (const r of rings) {
    if (r.t <= 0) continue;
    r.t--;
    const k = 1 - r.t / 22;
    r.m.position.z += SPEED;
    r.m.scale.setScalar((1 + k * 6) * r.s);
    r.m.material.opacity = 0.9 * (1 - k);
    if (r.t <= 0) r.m.visible = false;
  }
}

function explode(x, y, z, s) {
  const nf = Math.round(10 * s + 4);
  for (let i = 0; i < nf; i++) {
    const a = rand(0, 6.283), b = rand(-1, 1), c = Math.sqrt(1 - b * b), sp = rand(0.06, 0.28) * s;
    FIRE.add(x, y, z, Math.cos(a) * c * sp, b * sp * 0.8 + 0.04, Math.sin(a) * c * sp, rand(18, 34), 1.2 * s, rand(2.5, 4) * s, 1, C.fire1, C.fire2, 0.002, 0.9);
  }
  const ns = Math.round(8 * s + 4);

function jitterCyl(rTop, rBot, h, seg, seed, amp) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, 1);

    const f = 1 + amp * (Math.sin(3 * a + seed) * 0.6 + Math.sin(5 * a + seed * 2.3) * 0.4);
    p.setX(i, x * f); p.setZ(i, z * f);

  return g;
}

// ---------- 플레이어 ----------

}
function dropBomb() {

  const b = bombPool.find(b => !b.on);
  if (!b) return;
  bombs--; bombCool = 16;
  b.on = true; b.t = 0; b.sx = player.x; b.sz = player.z; b.tx = player.x; b.tz = player.z - RET;
  b.boss = null;
  if (onBoss(b.tx, b.tz)) { b.boss = boss; b.ox = b.tx - boss.x; b.oz = b.tz - boss.z; }
  b.mesh.visible = b.shadow.visible = b.marker.visible = true;

}
const keys = {};
function updatePlayer() {
  if (!player.alive) {

  }

  let ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let iz = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (ix && iz) { ix *= 0.707; iz *= 0.707; }
  const sp = 0.42;
  player.x += ix * sp; player.z += iz * sp;
  if (drag) {
    player.x += clamp(drag.tx - player.x, -0.9, 0.9);
    player.z += clamp(drag.tz - player.z, -0.9, 0.9);
  }
  player.x = clamp(player.x, -XB, XB);
  player.z = clamp(player.z, ZMIN, ZMAX);
  player.vx = player.x - ox; player.vz = player.z - oz;
  player.bank = lerp(player.bank, -player.vx * 1.6, 0.15);
  if (player.inv > 0) player.inv--;
  if (player.cool > 0) player.cool--;
  if (bombCool > 0) bombCool--;
  if ((keys.KeyZ || keys.Space || autoFire || drag) && player.cool <= 0) { fireCannon(); player.cool = 6; }
  if (keys.KeyX || wantBomb) { dropBomb(); wantBomb = false; }
  if (bombs < MAXB && ++bombRegen >= 100) { bombRegen = 0; bombs++; }
  if (player.flash > 0) player.flash--;
  // 엔진 불꽃
  FIRE.add(player.x + rand(-0.1, 0.1), AIR_Y, player.z + 2.1, 0, 0, 0.12, 12, 0.7, 0.2, 0.9, C.trail1, C.trail2, 0, 1);

// ---------- 갱신 ----------
function updateAir() {
  const d = diff();
  for (let i = airs.length - 1; i >= 0; i--) {
    const e = airs[i];
    e.t++;
    if (e.t < 0) continue;
    const p = pathPos(e, e.t);
    e.px = e.x; e.pz = e.z; e.x = p.x; e.z = p.z;
    if (e.t === 0) { e.px = e.x; e.pz = e.z - 0.3; e.mesh.visible = true; }
    const vx = e.x - e.px, vz = e.z - e.pz;
    if (vx * vx + vz * vz > 1e-6) {
      const yaw = Math.atan2(-vx, -vz);
      let dy = yaw - e.yaw; while (dy > Math.PI) dy -= 2 * Math.PI; while (dy < -Math.PI) dy += 2 * Math.PI;
      e.yaw += dy * 0.3;
      e.roll = lerp(e.roll, clamp(-dy * 12, -1, 1), 0.15);
    }
    e.mesh.position.set(e.x, AIR_Y, e.z);
    e.mesh.rotation.set(0, e.yaw, e.roll);
    tickFlash(e);
    if (e.t % 3 === 0) SMOKE.add(e.x, AIR_Y, e.z, 0, 0, 0, 16, 0.5, 1.2, 0.25, C.wake, C.wake, 0, 1);
    if (canShoot(e.x, e.z) && e.z < ZMAX - 4 && --e.cool <= 0) {
      if (e.type === 'bomber') { eFire(e.x, AIR_Y, e.z, 0.3 * Math.sqrt(d), 3, 0.25, 1.2); e.cool = rand(70, 100) / d; }
      else { eFire(e.x, AIR_Y, e.z, 0.34 * Math.sqrt(d), stage >= 3 ? 3 : 1, 0.2, 1); e.cool = rand(130, 240) / d; }
    }
    // 플레이어 충돌
    if (player.alive && state === 'play') {
      const dx = e.x - player.x, dz = e.z - player.z, rr = e.r * 0.6 + 1;
      if (dx * dx + dz * dz < rr * rr) {
        if (player.inv <= 0) { killPlayer(); e.hp -= 5; if (e.hp <= 0) { killAir(i); continue; } }
      }
    }
    if (pathDone(e)) { e.form.lost = true; removeObj(e); airs.splice(i, 1); }
  }
}

  else if (e.form.killed === e.form.n && !e.form.lost) dropItem(e.x, e.z, Math.random() < 0.65 ? 'P' : 'B');

}
function killGround(i) {

function updateGround() {

      else { eFire(e.x, y, e.z, 0.32 * Math.sqrt(d), stage >= 4 ? 2 : 1, 0.15, 1); e.cool = rand(100, 170) / d; }
    }

function updateBullets() {
  for (let i = pB.length - 1; i >= 0; i--) {
    const b = pB[i];
    b.x += b.vx; b.z += b.vz;
    let hit = false;
    for (let j = airs.length - 1; j >= 0; j--) {
      const e = airs[j];
      if (e.t < 0) continue;
      const dx = e.x - b.x, dz = e.z - b.z, rr = e.r + 0.3;
      if (dx * dx + dz * dz < rr * rr) {
        hit = true; e.hp--; setFlash(e);
        sparks(b.x, AIR_Y, b.z, 3);
        if (e.hp <= 0) killAir(j); else sfx('hit');
        break;
      }
    }
    if (hit || b.z < -80 || Math.abs(b.x) > 50) pB.splice(i, 1);
  }
  for (let i = eB.length - 1; i >= 0; i--) {
    const b = eB[i];
    b.x += b.vx; b.z += b.vz;
    b.y += (AIR_Y - b.y) * 0.1;
    if (state === 'play' && player.alive && player.inv <= 0 && Math.abs(b.y - AIR_Y) < 1.2) {
      const dx = b.x - player.x, dz = b.z - player.z, rr = 0.6 + 0.3 * b.s;
      if (dx * dx + dz * dz < rr * rr) { eB.splice(i, 1); killPlayer(); continue; }
    }
    if (b.z > ZMAX + 12 || b.z < -120 || Math.abs(b.x) > 55) eB.splice(i, 1);
  }
}
function bombHit(x, y, z) {
  explode(x, y + 0.5, z, 1.7);
  shockRing(x, y + 0.2, z, 1);
  sfx('boom');
  if (y < 0.5) splash(x, z);
  const R = 4.6;
  for (let i = grounds.length - 1; i >= 0; i--) {
    const e = grounds[i], dx = e.x - x, dz = e.z - z, rr = R + e.r * 0.5;
    if (dx * dx + dz * dz < rr * rr) { e.hp -= 12; setFlash(e); if (e.hp <= 0) killGround(i); }
  }
  if (boss && !boss.dying) {
    for (const p of boss.parts) {
      if (p.dead) continue;
      const dx = boss.x + p.lx - x, dz = boss.z + p.lz - z, rr = R + p.r * 0.6;
      if (dx * dx + dz * dz < rr * rr) { damagePart(p, 12); if (!boss || boss.dying) break; }
    }
  }
}
function updateBombs() {
  for (const b of bombPool) {
    if (!b.on) continue;
    b.t++;
    if (b.boss && boss === b.boss && !boss.dying) { b.tx = boss.x + b.ox; b.tz = boss.z + b.oz; }
    else b.tz += SPEED;
    const u = b.t / BT, gy = groundAt(b.tx, b.tz);
    const x = lerp(b.sx, b.tx, u), z = lerp(b.sz, b.tz, u);
    const y = lerp(AIR_Y - 0.6, gy, u * u) + Math.sin(u * Math.PI) * 2;
    b.mesh.position.set(x, y, z);
    b.mesh.rotation.set(-lerp(0.1, 1.3, u), 0, 0);
    b.shadow.position.set(x, groundAt(x, z) + 0.12, z);
    b.shadow.scale.setScalar(0.5 + (1 - u) * 0.4);
    b.marker.position.set(b.tx, gy + 0.15, b.tz);
    b.marker.scale.setScalar(1.6 + Math.sin(b.t * 0.6) * 0.3 + (1 - u) * 1.5);
    if (b.t >= BT) {
      b.on = false; b.mesh.visible = b.shadow.visible = b.marker.visible = false;
      bombHit(b.tx, gy, b.tz);
    }
  }
}
function updateItems() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.t++;
    it.z += 0.1; it.x += Math.sin(it.t * 0.05) * 0.05;
    const s = 2.3 + Math.sin(it.t * 0.2) * 0.25;
    it.spr.scale.set(s, s, 1);
    it.spr.position.set(it.x, AIR_Y + Math.sin(it.t * 0.1) * 0.3, it.z);
    if (state === 'play' && player.alive) {
      const dx = it.x - player.x, dz = it.z - player.z;
      if (dx * dx + dz * dz < 2.6 * 2.6) {
        if (it.type === 'P') { if (power < 4) { power++; showMsg('파워 업! Lv.' + power, 60); } else addScore(2000); }
        else { bombs = MAXB; showMsg('폭탄 보충!', 60); }
        sfx('power'); sparks(it.x, AIR_Y, it.z, 10, it.type === 'P' ? C.fire2 : C.water2);
        scene.remove(it.spr); items.splice(i, 1); continue;
      }
    }
    if (it.z > ZMAX + 8) { scene.remove(it.spr); items.splice(i, 1); }
  }
}
function spawnLogic() {
  if (clearT > 0) {
    if (--clearT === 0) { stage++; stageT = 0; bossPhase = false; nextWave = 120; nextShip = 300; showMsg('STAGE ' + stage, 120); }
    return;
  }
  if (!boss) {
    stageT++;
    if (stageT === BOSS_AT - 270) { bossPhase = true; warnT = 240; showMsg('WARNING! 거대 전함 접근', 240, 'warn'); }
    if (stageT === BOSS_AT) spawnBoss();
  }
  if (warnT > 0) { warnT--; if (warnT % 40 === 0) sfx('warn'); }
  if (bossPhase) return;
  const d = diff();
  if (--nextWave <= 0) {
    const r = Math.random();
    if (stageT > 60 * 15 && r < 0.14) spawnWave('bomber');
    else if (r < 0.45) spawnWave('dive', stage >= 2 ? 7 : 5);
    else if (r < 0.75) spawnWave('snake', 5 + Math.min(4, stage));
    else spawnWave('swoop', 4 + (stage >= 3 ? 2 : 0));
    nextWave = rand(150, 250) / Math.sqrt(d);
  }
  if (--nextShip <= 0) {
    const x = rand(-XB + 2, XB - 2), z = -100;
    if (groundAt(x, z) < 1) addShip(x, z);
    nextShip = rand(320, 520) / Math.sqrt(d);
  }
}

function update() {
  frame++;
  seaOff += SPEED; scrollDist += SPEED;
  updateIslands(); updateClouds();
  if (state === 'play') { updatePlayer(); spawnLogic(); }
  if (state === 'over') overT++;
  updateAir(); updateGround(); updateBoss(); updateBullets(); updateBombs(); updateItems(); updateRings();
  syncPlayerMesh();
  SMOKE.step(); FIRE.step();
  shake *= 0.9;
  boomLight.intensity *= 0.85;
  if (msgT > 0 && --msgT === 0) $('msg').style.opacity = 0;
}

// ---------- 렌더 ----------
let hudCache = '';
function updateHUD() {
  const showGame = state !== 'title';
  const lv = '기체 ' + '✈'.repeat(Math.max(0, lives));
  const bm = '폭탄 ' + bombs + '/' + MAXB;
  const pw = '파워 ' + '■'.repeat(power) + '□'.repeat(4 - power);
  const op = '자동사격 ' + (autoFire ? 'ON' : 'OFF') + ' (F) · 소리 ' + (muted ? 'OFF' : 'ON') + ' (M)';
  const bossVis = !!(boss && !boss.dying && showGame);
  const bossPct = boss ? Math.round(boss.parts.reduce((s, p) => s + p.hp, 0) / boss.total * 100) : 0;
  const key = [score, Math.max(hiScore, score), stage, lv, bm, pw, op, bossVis, bossPct, showGame, state].join('|');
  if (key === hudCache) return;
  hudCache = key;
  $('sc').textContent = score.toLocaleString();
  $('hi').textContent = Math.max(hiScore, score).toLocaleString();
  $('st').textContent = stage;
  $('lv').textContent = lv; $('bm').textContent = bm; $('pw').textContent = pw; $('opts').textContent = op;
  $('bottom').style.visibility = showGame ? 'visible' : 'hidden';
  $('bossbox').style.display = bossVis ? 'block' : 'none';
  $('bossfill').style.width = bossPct + '%';
  $('pbtn').style.display = (state === 'play' || state === 'pause') ? 'block' : 'none';
}
function render() {
  updateSea(frame / 60);
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const par = (state === 'play' || state === 'pause') ? player.x * 0.12 : 0;
  camera.position.set(CAM_POS.x + par + sx, CAM_POS.y + sy, CAM_POS.z);
  tmpLook.set(CAM_LOOK.x + par + sx * 0.5, CAM_LOOK.y, CAM_LOOK.z + sy * 0.5);
  camera.lookAt(tmpLook);
  // 조준점
  if (state === 'play' && player.alive) {
    const rz = player.z - RET;
    reticle.visible = true;
    reticle.position.set(player.x, groundAt(player.x, rz) + 0.18, rz);
    reticle.material.opacity = bombs > 0 ? 0.6 : 0.2;
  } else reticle.visible = false;
  // 총알
  S3.set(1, 1, 1);
  for (let i = 0; i < pB.length; i++) {
    const b = pB[i];
    EU.set(0, b.rot, 0); Q.setFromEuler(EU); V3.set(b.x, AIR_Y, b.z);
    M4.compose(V3, Q, S3); pbMesh.setMatrixAt(i, M4);
  }
  pbMesh.count = pB.length; pbMesh.instanceMatrix.needsUpdate = true;
  const pulse = 1 + Math.sin(frame * 0.4) * 0.15;
  for (let i = 0; i < eB.length; i++) {
    const b = eB[i];
    M4.makeScale(b.s, b.s, b.s); M4.setPosition(b.x, b.y, b.z); ebCore.setMatrixAt(i, M4);
    const g = b.s * pulse;
    M4.makeScale(g, g, g); M4.setPosition(b.x, b.y, b.z); ebGlow.setMatrixAt(i, M4);
  }
  ebCore.count = ebGlow.count = eB.length;
  ebCore.instanceMatrix.needsUpdate = ebGlow.instanceMatrix.needsUpdate = true;
  SMOKE.flush(); FIRE.flush();
  updateHUD();
  renderer.render(scene, camera);
}

// ---------- 입력 ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Enter' || e.code === 'Space') { if (state === 'title' || (state === 'over' && overT > 40)) startGame(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) togglePause();
  if (e.code === 'KeyM') { muted = !muted; showMsg(muted ? '소리 끔' : '소리 켬', 45); }
  if (e.code === 'KeyF') { autoFire = !autoFire; showMsg('자동사격 ' + (autoFire ? 'ON' : 'OFF'), 45); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

const cvs = renderer.domElement;
const pv = new THREE.Vector3();
function screenToAir(e) {
  const nx = e.clientX / innerWidth * 2 - 1, ny = -(e.clientY / innerHeight) * 2 + 1;
  return hitAir(pickCam, nx, ny, pv);
}
let lastTap = 0;
cvs.addEventListener('pointerdown', e => {
  try { if (!muted) ac(); } catch (err) {}
  if (state === 'title' || (state === 'over' && overT > 40)) { startGame(); return; }
  if (state === 'pause') { togglePause(); return; }
  if (state !== 'play') return;
  const now = performance.now();
  if (now - lastTap < 300) wantBomb = true;
  lastTap = now;
  const p = screenToAir(e);
  if (!p || !player.alive) return;
  drag = { id: e.pointerId, sx: p.x, sz: p.z, px: player.x, pz: player.z, tx: player.x, tz: player.z };
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
cvs.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = screenToAir(e);
  if (!p) return;
  drag.tx = drag.px + (p.x - drag.sx) * 1.3;
  drag.tz = drag.pz + (p.z - drag.sz) * 1.3;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
$('pbtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); togglePause(); });
addEventListener('resize', resize);

// ---------- 시작 ----------
resize();
for (let k = 0; k < 3; k++) { const is = islands[k]; activateIsland(is, -70 + k * 42); }
nextIsland = 30;
setCenter(titleHTML());

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { if (state !== 'pause') update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
