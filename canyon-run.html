  #cross { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; z-index: 8; pointer-events: none; display: none;
    border: 2px solid rgba(160,255,200,.85); border-radius: 50%; box-shadow: 0 0 6px rgba(100,255,180,.6); }
  #cross::before, #cross::after { content: ""; position: absolute; background: rgba(160,255,200,.9); }
  #cross::before { left: 15px; top: -8px; width: 2px; height: 48px; clip-path: polygon(0 0,100% 0,100% 25%,0 25%,0 75%,100% 75%,100% 100%,0 100%); }
  #cross::after { top: 15px; left: -8px; height: 2px; width: 48px; clip-path: polygon(0 0,25% 0,25% 100%,0 100%,0 0,75% 0,100% 0,100% 100%,75% 100%,75% 0); }

    border: 2px solid #ff4a5a; transform: rotate(45deg); box-shadow: 0 0 8px rgba(255,60,60,.7); }

  .btn { position: fixed; z-index: 12; display: none; border: 2px solid rgba(255,200,150,.6); background: rgba(80,30,15,.55); color: #fff; font-weight: 800; border-radius: 999px; font-family: inherit; padding: 0; touch-action: none; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
if (!window.THREE) {
  $('overlay').innerHTML = '<h1>오류</h1><div class="ctl">three.js를 불러오지 못했습니다.<br>인터넷 연결을 확인하세요.</div>';
  return;
}

// ---------- 유틸 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hash(a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
function loadHi() { try { return +localStorage.getItem('hi_canyon') || 0; } catch (e) { return 0; } }
function saveHi(v) { try { localStorage.setItem('hi_canyon', v); } catch (e) {} }
const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);
const tA = new V3(), tB = new V3(), tC = new V3(), tD = new V3(), tE = new V3();

// ---------- 사운드 (WebAudio) ----------
let actx = null, muted = false;
function sfx(type) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const cfg = {
      shot:    ['square',   720, 320, 0.025, 0.05],
      hit:     ['triangle', 420, 160, 0.05, 0.06],
      boom:    ['sawtooth', 180,  30, 0.18, 0.4],
      big:     ['sawtooth', 110,  18, 0.3,  1.0],
      missile: ['sawtooth', 260, 900, 0.07, 0.3],
      lock:    ['sine',    1300, 1700, 0.05, 0.06],
      ring:    ['sine',     600, 1600, 0.15, 0.3],
      hurt:    ['sawtooth', 240,  60, 0.2,  0.35],
      scrape:  ['square',   140,  70, 0.07, 0.12],
      warn:    ['square',   440, 220, 0.12, 0.7],
      empty:   ['triangle', 200, 180, 0.04, 0.05],
      start:   ['sine',     300, 900, 0.12, 0.35],
    }[type];
    if (!cfg) return;
    o.type = cfg[0];
    o.frequency.setValueAtTime(cfg[1], t);
    o.frequency.exponentialRampToValueAtTime(cfg[2], t + cfg[4]);
    g.gain.setValueAtTime(cfg[3], t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + cfg[4]);
    o.start(t); o.stop(t + cfg[4]);
  } catch (e) {}
}

// ---------- DOM ----------
const el = {
  score: $('score'), hi: $('hi'), shield: $('shieldFill'), speed: $('speed'), missiles: $('missiles'), dist: $('dist'),
  bossWrap: $('bossWrap'), bossFill: $('bossFill'), cross: $('cross'), flash: $('flash'), msg: $('msg'), overlay: $('overlay'),
  locks: Array.prototype.slice.call(document.querySelectorAll('.lock')),
  pops: Array.prototype.slice.call(document.querySelectorAll('.pop')),
};

// ---------- 상수 ----------
const DT = 1 / 60;
const CH_LEN = 60, NCH = 8, SEG = 5, NZ = CH_LEN / SEG, NY = 8, SY = 6, NXF = 10;
const BOSS_EVERY = 3000, MAXM = 6;
const cxAt = z => Math.sin(z * 0.0042) * 16 + Math.sin(z * 0.0113 + 1.3) * 6;
const hwAt = z => 17 + Math.sin(z * 0.0131) * 5 + Math.sin(z * 0.0297 + 2) * 2.5;
function rough(iz, j, side) { return (hash(iz, j * 7 + side * 31) - 0.5) * 2.6 + Math.sin(iz * 0.9 + j * 1.3 + side) * 0.8; }
function wallVX(iz, j, side) {
  const z = -iz * SEG, y = j * SY;
  return cxAt(z) + side * (hwAt(z) + y * 0.38 + rough(iz, j, side));
}
// 벽 안쪽 면의 x (정점 격자 쌍선형 보간)
function wallInner(z, y, side) {
  const fz = -z / SEG, iz = Math.floor(fz), tz = fz - iz;
  const fy = clamp(y / SY, 0, NY - 0.001), j = Math.floor(fy), ty = fy - j;
  const a = wallVX(iz, j, side), b = wallVX(iz + 1, j, side), c = wallVX(iz, j + 1, side), d = wallVX(iz + 1, j + 1, side);
  return lerp(lerp(a, b, tz), lerp(c, d, tz), ty);
}

// ---------- 렌더러 / 씬 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
const FOG = 0xeab88e;
scene.fog = new THREE.Fog(FOG, 70, 400);
(function makeSky() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f63a8'); gr.addColorStop(0.45, '#8cb4d8'); gr.addColorStop(0.75, '#f0c89c'); gr.addColorStop(1, '#eab88e');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  scene.background = new THREE.CanvasTexture(c);
})();
function makeGlowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTex();

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.3, 700);
let baseFov = 70, camBack = 9;
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  baseFov = camera.aspect < 1 ? 68 + (1 - camera.aspect) * 30 : 66;
  camBack = camera.aspect < 1 ? 11 : 9;
  camera.updateProjectionMatrix();
}
addEventListener('resize', onResize); onResize();

scene.add(new THREE.HemisphereLight(0xfff0dd, 0x7a3a20, 0.75));
const sunLight = new THREE.DirectionalLight(0xffe6c0, 0.95);
sunLight.position.set(-0.6, 1, 0.35);
scene.add(sunLight);
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xfff2cc, fog: false, depthWrite: false, transparent: true, blending: THREE.AdditiveBlending }));
sunSprite.scale.set(170, 170, 1);
scene.add(sunSprite);

// ---------- 지오메트리 헬퍼 ----------
function buildGeo(parts) {
  const pos = [], col = [];
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), c = new THREE.Color();
  for (const p of parts) {
    const g = p[0].index ? p[0].toNonIndexed() : p[0].clone();
    const t = p[2] || [0, 0, 0], r = p[3] || [0, 0, 0], s = p[4] || [1, 1, 1];
    m.compose(new V3(t[0], t[1], t[2]), q.setFromEuler(e.set(r[0], r[1], r[2])), new V3(s[0], s[1], s[2]));
    g.applyMatrix4(m);
    c.set(p[1]);
    const a = g.attributes.position.array;
    for (let i = 0; i < a.length; i += 3) { pos.push(a[i], a[i + 1], a[i + 2]); col.push(c.r, c.g, c.b); }
    g.dispose(); p[0].dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}
function jitter(g, ax, ay, az, seed) {
  const a = g.attributes.position.array;
  for (let i = 0; i < a.length; i += 3) {
    const k = a[i] * 13.1 + a[i + 1] * 7.7 + seed, l = a[i + 2] * 3.3 - a[i + 1] * 1.9;
    a[i] += (hash(k, l) - 0.5) * ax;
    a[i + 1] += (hash(k + 5, l) - 0.5) * ay;
    a[i + 2] += (hash(k + 9, l) - 0.5) * az;
  }
  g.computeVertexNormals();
  return g;
}
const Box = (a, b, c) => new THREE.BoxGeometry(a, b, c);
const Cone = (r, h, s) => new THREE.ConeGeometry(r, h, s);
const Cyl = (a, b, h, s) => new THREE.CylinderGeometry(a, b, h, s);
const Sph = (r, w, h) => new THREE.SphereGeometry(r, w, h);
const PI2 = Math.PI / 2;

// ---------- 재질 ----------
const wallMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 0, side: THREE.DoubleSide });
const rockMat = new THREE.MeshPhongMaterial({ color: 0xa4553a, flatShading: true, shininess: 0 });
const vcMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 40 });
const darkMat = new THREE.MeshPhongMaterial({ color: 0x26262c, flatShading: true });
const bossMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 40, emissive: 0x000000 });
const ringMat = new THREE.MeshBasicMaterial({ color: 0x5ff4ff });
const pbMat = new THREE.MeshBasicMaterial({ color: 0xfff1a0, fog: false });
const ebMat = new THREE.MeshBasicMaterial({ color: 0xff3a6a, fog: false });
const mineMat = new THREE.MeshBasicMaterial({ color: 0xffa020, fog: false });
const redLightMat = new THREE.MeshBasicMaterial({ color: 0xff2020, fog: false });
const additive = (color, op) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });

// ---------- 공유 지오메트리 ----------
const pillarGeo = jitter(new THREE.CylinderGeometry(0.72, 1, 1, 7, 5), 0.25, 0.04, 0.25, 1);
const archGeo = jitter(new THREE.BoxGeometry(1, 1, 1, 10, 3, 3), 0.0, 0.35, 0.3, 2);
const ringGeo = new THREE.TorusGeometry(3.6, 0.35, 6, 24);
const pbGeo = Box(0.22, 0.22, 4);
const ebGeo = Sph(0.6, 8, 6);
const missileGeo = Cyl(0.18, 0.22, 1.5, 6); missileGeo.rotateX(PI2);
const fbGeo = Sph(1, 10, 8);

const playerGeo = buildGeo([
  [Cone(0.7, 5, 6), 0xe8eef8, [0, 0, -0.6], [-PI2, 0, 0]],
  [Cyl(0.55, 0.7, 2.2, 6), 0xbfc8d6, [0, 0, 3.0], [PI2, 0, 0]],
  [Box(3.8, 0.14, 1.7), 0x2f6fe0, [2.0, -0.15, 1.6], [0, -0.42, 0]],
  [Box(3.8, 0.14, 1.7), 0x2f6fe0, [-2.0, -0.15, 1.6], [0, 0.42, 0]],
  [Box(0.12, 1.5, 1.3), 0x2f6fe0, [0, 0.8, 3.4], [-0.3, 0, 0]],
  [Box(2.8, 0.1, 0.9), 0x2f6fe0, [0, 0.05, 3.7]],
  [Sph(0.45, 8, 6), 0x4de1ff, [0, 0.45, -0.4], [0, 0, 0], [1, 0.8, 2.2]],
  [Box(0.3, 0.3, 1.2), 0x333a44, [1.6, -0.25, 0.6]],
  [Box(0.3, 0.3, 1.2), 0x333a44, [-1.6, -0.25, 0.6]],
]);
const fighterGeo = buildGeo([
  [Cone(0.8, 4, 5), 0x9a2b2b, [0, 0, 0.6], [PI2, 0, 0]],
  [Box(5.6, 0.16, 1.5), 0x3a3a46, [0, 0, -0.6]],
  [Box(0.16, 1.3, 1.1), 0xe0503a, [2.7, 0.5, -0.8]],
  [Box(0.16, 1.3, 1.1), 0xe0503a, [-2.7, 0.5, -0.8]],
  [Sph(0.4, 6, 5), 0xffc04d, [0, 0.45, 0.6], [0, 0, 0], [1, 0.8, 1.8]],
  [Cyl(0.45, 0.5, 0.8, 6), 0x2a2a30, [0, 0, -1.6], [PI2, 0, 0]],
]);
const turretGeo = buildGeo([
  [Box(1.0, 3.2, 3.2), 0x4a4850],
  [Sph(1.25, 8, 6), 0x6a6470],
]);
const barrelGeo = Cyl(0.22, 0.28, 2.8, 6); barrelGeo.rotateX(PI2); barrelGeo.translate(0, 0, 1.5);
const lightGeo = Sph(0.32, 6, 5);
const bossGeo = buildGeo([
  [new THREE.OctahedronGeometry(4, 0), 0x5a1e2e, [0, 0, 0], [0, 0, 0], [1.5, 0.7, 2.2]],
  [Box(22, 0.7, 6), 0x3b3f4a, [0, 0, -1]],
  [Box(1.2, 4.5, 6.5), 0xc33a5a, [11, 0, -1]],
  [Box(1.2, 4.5, 6.5), 0xc33a5a, [-11, 0, -1]],
  [Box(8, 0.5, 4), 0x8a2a3e, [0, 1.2, -2]],
  [Cyl(0.45, 0.45, 5, 6), 0x222228, [5, -0.9, 3], [PI2, 0, 0]],
  [Cyl(0.45, 0.45, 5, 6), 0x222228, [-5, -0.9, 3], [PI2, 0, 0]],
  [Cyl(0.45, 0.45, 5, 6), 0x222228, [8, -0.6, 2], [PI2, 0, 0]],
  [Cyl(0.45, 0.45, 5, 6), 0x222228, [-8, -0.6, 2], [PI2, 0, 0]],
  [Cyl(1.1, 1.5, 3, 8), 0x46464e, [3, 0, -6], [PI2, 0, 0]],
  [Cyl(1.1, 1.5, 3, 8), 0x46464e, [-3, 0, -6], [PI2, 0, 0]],
]);

// ---------- 플레이어 ----------
const P = { mesh: new THREE.Group(), vx: 0, vy: 0, prev: new V3() };
P.pos = P.mesh.position;
const plMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 60 });
P.mesh.add(new THREE.Mesh(playerGeo, plMat));
const engine = new THREE.Mesh(Cone(0.5, 2.5, 8), additive(0x66ccff, 0.85));
engine.geometry.rotateX(PI2); engine.geometry.translate(0, 0, 1.25);
engine.position.set(0, 0, 4.1);
P.mesh.add(engine);
const muzzle = [-1, 1].map(s => {
  const m = new THREE.Mesh(Sph(0.45, 6, 5), additive(0xffe9a0, 0.95));
  m.position.set(s * 1.6, -0.25, -0.2); m.visible = false; P.mesh.add(m);
  return { m, t: 0 };
});
scene.add(P.mesh);

// ---------- 파티클 (Points) ----------
function makePS(n, size) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) pos[i * 3 + 1] = -9999;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, fog: false });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  return { n, pos, col, geo, vel: new Float32Array(n * 3), base: new Float32Array(n * 3), life: new Float32Array(n), max: new Float32Array(n), drag: new Float32Array(n), next: 0 };
}
const fireP = makePS(700, 3.2);
const sparkP = makePS(900, 0.9);
function emit(ps, x, y, z, vx, vy, vz, life, r, g, b, drag) {
  const i = ps.next; ps.next = (i + 1) % ps.n;

  }
  slGeo.attributes.position.needsUpdate = true;
  slMat.opacity = clamp(0.06 + (speed - 55) / 90 + boostAmt * 0.4, 0.04, 0.75);
  sunSprite.position.set(P.pos.x - 120, 150, P.pos.z - 560);
  shake *= 0.9; if (shake < 0.01) shake = 0;
  flashA = Math.max(0, flashA - DT * 2);
  if (msgT > 0) { msgT -= DT; if (msgT <= 0) el.msg.style.opacity = 0; }
  // 카메라
  const pos = P.pos;
  const tx = pos.x - P.vx * 0.10, ty = pos.y + 3.4 - P.vy * 0.05, tz = pos.z + camBack + boostAmt * 2;
  camBase.x += (tx - camBase.x) * 0.1;
  camBase.y += (ty - camBase.y) * 0.1;
  camBase.z += (tz - camBase.z) * 0.25;
  camera.position.set(camBase.x + (Math.random() - 0.5) * shake * 1.4, camBase.y + (Math.random() - 0.5) * shake * 1.4, camBase.z);
  lookAt.set(pos.x * 0.85 + camBase.x * 0.15, pos.y + 1.2, pos.z - 40);
  camera.lookAt(lookAt);
  camera.rotateZ(-P.vx * 0.005);
  const fov = Math.min(115, baseFov + Math.max(0, speed - 55) * 0.35 + boostAmt * 8);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
}
function update() {
  time += DT;
  if (state === 'pause') return;
  if (state === 'title') updateTitle();
  else if (state === 'play') updatePlay();
  else if (state === 'over') {
    overT += DT;
    speed *= 0.97; P.pos.z -= speed * DT;
    if (overT > 1 && !overShown) { overShown = true; setOverlay('over'); }
  }
  if (state !== 'title') {
    collectTargets();
    updateFighters(); updateTurrets();
    if (boss.active) updateBoss();
    updateBullets();
  }
  updateWorld();
}

// ---------- 렌더 / HUD ----------
const hudCache = {};
function setText(e, key, v) { if (hudCache[key] !== v) { hudCache[key] = v; e.textContent = v; } }
function setStyle(e, key, prop, v) { if (hudCache[key] !== v) { hudCache[key] = v; e.style[prop] = v; } }
function render() {
  renderer.render(scene, camera);
  setStyle(el.flash, 'flash', 'opacity', flashA.toFixed(2));
  if (state === 'title') return;
  const sc = Math.floor(score);
  setText(el.score, 'score', sc.toLocaleString());
  setText(el.hi, 'hi', 'HI ' + Math.max(hiScore, sc).toLocaleString());
  setStyle(el.shield, 'shield', 'width', Math.max(0, shield).toFixed(0) + '%');
  const low = shield < 30 ? 'low' : '';
  if (hudCache.low !== low) { hudCache.low = low; el.shield.className = low; }
  setText(el.speed, 'speed', Math.round(speed * 9) + ' km/h');
  setText(el.missiles, 'mis', '◆'.repeat(missiles) + '◇'.repeat(MAXM - missiles));
  setText(el.dist, 'dist', Math.floor(dist).toLocaleString() + ' m');
  if (boss.active) setStyle(el.bossFill, 'boss', 'width', (boss.hp / boss.maxHp * 100).toFixed(1) + '%');
  // 조준선 & 락온
  if (state === 'play') {
    tD.set(P.pos.x, P.pos.y, P.pos.z - 90).project(camera);
    el.cross.style.display = 'block';
    el.cross.style.transform = 'translate(' + ((tD.x * 0.5 + 0.5) * innerWidth).toFixed(1) + 'px,' + ((-tD.y * 0.5 + 0.5) * innerHeight).toFixed(1) + 'px)';
    const locks = getLocks(Math.min(4, missiles));
    for (let i = 0; i < el.locks.length; i++) {
      const d = el.locks[i];
      if (i < locks.length) {
        d.style.display = 'block';
        d.style.transform = 'translate(' + locks[i].sx.toFixed(1) + 'px,' + locks[i].sy.toFixed(1) + 'px) rotate(45deg)';
      } else d.style.display = 'none';
    }
    if (locks.length > lastLockN) sfx('lock');
    lastLockN = locks.length;
  } else if (state !== 'pause') {
    el.cross.style.display = 'none';
    for (const d of el.locks) d.style.display = 'none';
  }
}

// ---------- 입력 ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') {
    if (state === 'title' || (state === 'over' && overT > 0.6)) startGame();
    else if (state === 'pause') setPause(false);
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) setPause(state === 'play');
  if (e.code === 'Space' && state === 'play' && !e.repeat) fireMissiles();
  if (e.code === 'KeyM') { muted = !muted; showMsg(muted ? '사운드 끔' : '사운드 켬', 0.9, '#cfe'); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; setPause(true); });

addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a,button')) return;
  if (e.pointerType === 'touch') document.body.classList.add('touch');
  if (state === 'title' || (state === 'over' && overT > 0.8)) { startGame(); return; }
  if (state === 'pause') { setPause(false); return; }
  if (state !== 'play') return;
  touch = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: P.pos.x, py: P.pos.y, tx: P.pos.x, ty: P.pos.y };
});
addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id) return;
  touch.tx = touch.px + (e.clientX - touch.sx) * (40 / Math.max(320, innerWidth)) * 1.2;
  touch.ty = clamp(touch.py - (e.clientY - touch.sy) * (30 / Math.max(320, innerHeight)) * 1.3, 2.2, 25);
});
function endTouch(e) { if (touch && e.pointerId === touch.id) touch = null; }
addEventListener('pointerup', endTouch);
addEventListener('pointercancel', endTouch);
$('btnMissile').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (state === 'play') fireMissiles(); });
$('btnPause').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); setPause(state === 'play'); });

// ---------- 시작 ----------
resetWorld();
setOverlay('title');
updateWorld();

// ---------- 루프 (60fps 고정 스텝) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
